<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the coaches</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to the CSS file -->
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        p {
            font-size: 18px;
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            font-size: 40px;
            color: white;
            background-color: rgb(175, 40, 40);
            border: 3px solid black;
            border-radius: 10px;
        }

        h3 {
            display: inline-block;
            font-size: 25px;
            text-decoration: underline;
        }

        table {
            width: 100%;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse;
        }

        td:nth-child(1) {
            background-color: rgb(92, 92, 92);
            color: white;
        }

        td:nth-child(2) {
            background-color: rgb(167, 167, 167);
        }

        td {
            border: 5px solid rgb(44, 44, 44);
            padding: 10px;
            vertical-align: top;
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <!-- large heading -->
    <h1 class="site-heading" id="welcomeHeading">GymBros!</h1>

    <!-- navigation bar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="meet_coaches.html" class="active">Meet our coaches!</a>
        <a href="join_now.html">Join Now!</a>
        <a href="schedule.html">Workout Schedule</a>
        <span id="authButton"></span> <!-- Placeholder for Login/Logout button -->
    </div>
    <div>
        <h2>Our Coaches</h2>
    </div>
    <!-- tbody used -->
    <table>
        <tbody id="OurCoaches"></tbody>
    </table>

    <script>
        // Check if a user is logged in and update the heading and navigation
        window.onload = function () {
            const loggedInUser = localStorage.getItem('loggedInUser');
            const authButton = document.getElementById('authButton');

            if (loggedInUser) {
                document.getElementById('welcomeHeading').innerHTML = `GymBros, welcome ${loggedInUser}!`;
                authButton.innerHTML = `<a href="#" onclick="logout()">Logout</button>`; // Change to Logout button
            } else {
                authButton.innerHTML = `<a href="login.html">Login</a>`; // Default to Login link
            }
        };
        // Logout function to clear user data
        function logout() {
            localStorage.removeItem('loggedInUser'); // Clear user data
            window.location.href = 'index.html'; // Redirect to homepage
        };

        //NOTE: Each field is using placeholders. aboutCoach is organized with initials for testing.
        const coaches = [
            {
                coachName: "Johnny Joestar",
                coachImage: "https://images.pexels.com/photos/7218111/pexels-photo-7218111.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",
                imageAlt: "Man in orange holding a frame",
                aboutCoach: "I have 9 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in endurance and strength training. I enjoy reading in my free time."
            },
            {
                coachName: "Diego Brando",
                coachImage: "https://images.pexels.com/photos/1043473/pexels-photo-1043473.jpeg",
                imageAlt: "Man wearing a suit outside",
                aboutCoach: "I have 7 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in high-intensity interval training. I enjoy hiking in my free time."
            },
            {
                coachName: "Steven Steel",
                coachImage: "https://images.pexels.com/photos/41008/cowboy-ronald-reagan-cowboy-hat-hat-41008.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",
                imageAlt: "Close up picture of man wearing cowboy hat",
                aboutCoach: "I have 33 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in core strength and stability training. I enjoy walking my dogs in my free time."
            },
            {
                coachName: "Enrico Pucci",
                coachImage: "https://images.pexels.com/photos/29083876/pexels-photo-29083876/free-photo-of-young-man-outdoors-with-stylish-hat-and-glasses.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",
                imageAlt: "Man wearing a orange shirt, hat, and glasses outside",
                aboutCoach: "I have 6 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in powerlifting techniques training. I enjoy traveling in my free time."
            },
            {
                coachName: "Jolyne Cujoh",
                coachImage: "https://images.pexels.com/photos/1065084/pexels-photo-1065084.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",

                aboutCoach: "I have 12 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in calisthenics training. I enjoy painting in my free time."

            {
                coachName: "Trish Una",

            },
            {
                coachName: "Jean Polnareff",
                coachImage: "https://images.pexels.com/photos/819530/pexels-photo-819530.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",
                imageAlt: "Man in blue shirt outside",
                aboutCoach: "I have 12 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in functional mobility and flexibility training. I enjoy fishing in my free time."
            },
            {
                coachName: "Robert Speedwagon",
                coachImage: "https://images.pexels.com/photos/1681010/pexels-photo-1681010.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1",
                imageAlt: "Man in red shirt with gray under shirt outside",
                aboutCoach: "I have 2 years of experience as a CrossFit coach and am dedicated to helping my athletes achieve their full potential. I specialize in Sport-specific training. I enjoy dancing in my free time."
            },
        ]

        //function to displays the Coaches in Coaches
        function listCoaches() {
            displayArea = document.getElementById("OurCoaches")
            displayArea.innerHTML = ""

            //Loop to display coach info
            for (i = 0; i < coaches.length; i++) {
                coach = coaches[i]
                displayArea.innerHTML += `
                        <tr>
                            <td><img src="${coach.coachImage}" alt="${coach.imageAlt}"></td>
                            <td>
                                <h3>${coach.coachName}</h3>
                                <p>${coach.aboutCoach}</p>
                            </td>
                        <tr>
                     `;
            }
        }
        listCoaches()
    </script>

</body>

</html>
